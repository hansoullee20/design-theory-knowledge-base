$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Design Theory Claim"
type: object
additionalProperties: false

$defs:
  source_selector:
    oneOf:
      - {type: object, additionalProperties: false, required: [type, value], properties: {type: {const: PageSelector}, value: {type: string, minLength: 1}}}
      - {type: object, additionalProperties: false, required: [type, value], properties: {type: {const: SectionSelector}, value: {type: string, minLength: 1}}}
      - {type: object, additionalProperties: false, required: [type, value], properties: {type: {const: FigureSelector}, value: {type: string, minLength: 1}}}
      - {type: object, additionalProperties: false, required: [type, value], properties: {type: {const: TableSelector}, value: {type: string, minLength: 1}}}
      - type: object
        additionalProperties: false
        required: [type, value]
        properties:
          type: {const: FragmentSelector}
          value: {type: string, minLength: 1}
          conforms_to: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [type, exact]
        properties:
          type: {const: TextQuoteSelector}
          exact: {type: string, minLength: 1}
          prefix: {type: string, minLength: 1}
          suffix: {type: string, minLength: 1}
  source_locator:
    type: object
    additionalProperties: false
    required: [source, selector]
    properties:
      source: {type: string, pattern: "^source:[a-z0-9]+(?:-[a-z0-9]+)*$"}
      selector: {$ref: "#/$defs/source_selector"}

allOf:
  - if:
      properties:
        predicate:
          const: "requires"
      required:
        - predicate
    then:
      required:
        - constraint
      properties:
        modality:
          const: "prescriptive"
    else:
      not:
        required:
          - constraint
  - if:
      properties:
        predicate:
          const: "conventional_for"
      required:
        - predicate
    then:
      properties:
        modality:
          const: "descriptive"
  - if:
      properties:
        record_status:
          const: "deprecated"
      required:
        - record_status
    then:
      required:
        - replaced_by
      properties:
        replaced_by:
          minItems: 1
    else:
      properties:
        replaced_by:
          maxItems: 0

required:
  - id
  - kind
  - statement
  - modality
  - subject
  - predicate
  - object
  - basis
  - evidence_status
  - sources
  - record_status
  - schema_version

properties:
  id:
    type: string
    pattern: "^claim:[a-z0-9]+(?:-[a-z0-9]+)*$"

  kind:
    const: "claim"

  statement:
    type: string
    minLength: 1

  modality:
    enum:
      - "descriptive"
      - "explanatory"
      - "prescriptive"

  subject:
    type: string
    pattern: "^concept:[a-z0-9]+(?:-[a-z0-9]+)*$"

  predicate:
    enum:
      - "increases"
      - "decreases"
      - "influences"
      - "requires"
      - "conventional_for"

  object:
    type: string
    pattern: "^concept:[a-z0-9]+(?:-[a-z0-9]+)*$"

  constraint:
    type: object
    additionalProperties: false
    required:
      - operator
      - value
      - unit
    properties:
      operator:
        enum:
          - "gte"
          - "lte"
          - "gt"
          - "lt"
          - "eq"
      value:
        type: number
      unit:
        type: string
        minLength: 1

  basis:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - "empirical"
        - "theoretical"
        - "conventional"
        - "standard"
        - "doctrinal"
        - "expert-opinion"

  evidence_status:
    enum:
      - "unassessed"
      - "assessed"

  scope:
    type: string
    default: ""

  sources:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^source:[a-z0-9]+(?:-[a-z0-9]+)*$"

  source_locators:
    type: array
    uniqueItems: true
    items: {$ref: "#/$defs/source_locator"}
    default: []

  record_status:
    enum:
      - "draft"
      - "reviewed"
      - "deprecated"

  replaced_by:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^claim:[a-z0-9]+(?:-[a-z0-9]+)*$"
    default: []

  notes:
    type: string
    default: ""

  schema_version:
    const: "0.1"
