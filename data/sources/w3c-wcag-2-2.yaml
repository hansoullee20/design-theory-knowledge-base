notes: Current W3C Recommendation dated 2024-12-12. WCAG 2.2 Success Criterion 1.4.3 Contrast (Minimum), Level AA, requires at least 4.5:1 for text and images of text, with 3:1 for large text and stated incidental/logotype exceptions. Exact locator machinery remains deferred under PF-001.
